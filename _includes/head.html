<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#262427" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
  {% seo %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
          colors: {
            th: {
              bg: 'var(--c-bg)',
              surface: 'var(--c-surface)',
              elevated: 'var(--c-elevated)',
              border: 'var(--c-border)',
              text: 'var(--c-text)',
              dim: 'var(--c-dim)',
              bold: 'var(--c-bold)',
              accent: 'var(--c-accent)',
              link: 'var(--c-link)',
              red: 'var(--c-red)',
              green: 'var(--c-green)',
              magenta: 'var(--c-magenta)',
              cyan: 'var(--c-cyan)',
            }
          },
        }
      }
    }
  </script>

  <!-- Prevent flash: detect theme before paint -->
  <script>
    (function() {
      var s = localStorage.getItem('theme');
      var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (s === 'dark' || (!s && d)) document.documentElement.classList.add('dark');
    })();
  </script>

  <!-- Critical CSS: variables + base resets -->
  <style>
    :root {
      --c-bg: #FAFAFA;
      --c-surface: #F0F0F0;
      --c-elevated: #FFFFFF;
      --c-border: #D8D8D8;
      --c-text: #2A2A2A;
      --c-dim: #7A7A7A;
      --c-bold: #1A1A1A;
      --c-accent: #C08A19;
      --c-link: #2B8DB3;
      --c-red: #D1364E;
      --c-green: #6EA226;
      --c-magenta: #7C5EC1;
      --c-cyan: #2B9DA4;
      --c-glass: rgba(250, 250, 250, 0.78);
      --c-glass-border: rgba(200, 200, 200, 0.5);
    }
    html.dark {
      --c-bg: #262427;
      --c-surface: #1E1C1F;
      --c-elevated: #2E2C30;
      --c-border: #545452;
      --c-text: #e5e5e5;
      --c-dim: #b1b1b1;
      --c-bold: #f7f7f7;
      --c-accent: #ffca58;
      --c-link: #49cae4;
      --c-red: #ff7272;
      --c-green: #bcdf59;
      --c-magenta: #a093e2;
      --c-cyan: #aee8f4;
      --c-glass: rgba(30, 28, 31, 0.78);
      --c-glass-border: rgba(84, 84, 82, 0.3);
    }
    body {
      background: var(--c-bg);
      color: var(--c-text);
    }
  </style>

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
