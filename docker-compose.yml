services:
  site:
    image: jekyll/jekyll:4
    command: sh -c "gem install webrick jekyll-seo-tag jekyll-sitemap --no-document && jekyll serve --watch --force_polling --host 0.0.0.0 --port 4000 --future"
    # Docker bridge traffic can be blocked by host firewall or VPN rules.
    # Host networking makes the local preview available directly on port 4000.
    network_mode: host
    volumes:
      - .:/srv/jekyll
    environment:
      JEKYLL_ENV: development
