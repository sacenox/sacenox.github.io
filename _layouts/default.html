---
---

<!doctype html>
<html lang="en">
  {% include head.html %}
  <body class="font-serif antialiased bg-[#171717] text-[#d1d1d1] min-h-screen flex flex-col">

    <div class="max-w-3xl mx-auto w-full px-6 sm:px-8 flex flex-col min-h-screen">

      <header class="w-full flex items-center justify-between py-8 sm:py-10 mb-8">
        <a href="{{ '/' | relative_url }}" class="flex items-center gap-3 text-xl sm:text-2xl font-semibold text-[#f0f0f0] no-underline tracking-tight">
          <img src="https://avatars.githubusercontent.com/u/33629225?v=4" alt="avatar" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full ring-1 ring-[#333]" width="36" height="36" loading="eager" decoding="async">
          sacenox
        </a>
        <nav class="flex items-center gap-6 text-base font-sans" aria-label="Main">
          <a href="{{ '/' | relative_url }}"
             class="nav-link{% if page.url == '/' %} active{% endif %}">posts</a>
          <a href="{{ '/about' | relative_url }}"
             class="nav-link{% if page.url == '/about' or page.url == '/about/' %} active{% endif %}">about</a>
        </nav>
      </header>

      <main class="flex-1 w-full">
        {{ content }}
      </main>

      <footer class="py-10 mt-12 text-sm font-sans text-[#555]">
        <span class="text-[#888]">{{ site.time | date: "%Y" }}</span>
      </footer>

    </div>

  </body>
</html>
