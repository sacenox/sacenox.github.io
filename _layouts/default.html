---

<!doctype html>
<html lang="en">
  {% include head.html %}
  <body class="font-mono antialiased min-h-screen">
    <canvas id="galaxy" aria-hidden="true"></canvas>

    <div class="relative z-10 min-h-screen flex flex-col px-6 sm:px-10 lg:px-16 py-8 sm:py-12">

      <!-- ── Header: sits at top, wide, no boxes ── -->
      <header class="w-full flex flex-col sm:flex-row sm:items-baseline sm:justify-between gap-2 sm:gap-4 mb-10 sm:mb-16">
        <div>
          <a href="{{ '/' | relative_url }}" class="inline-flex items-center text-sm sm:text-base no-underline">
            <span class="text-th-green font-semibold">sacenox</span><span class="text-th-dim">@</span><span class="text-th-magenta">void</span><span class="text-th-dim">:~$</span>
            <span class="cursor" aria-hidden="true"></span>
          </a>
        </div>
        <nav class="flex items-center gap-6 text-sm" aria-label="Main">
          <a href="{{ '/' | relative_url }}"
             class="nav-link{% if page.url == '/' %} active{% endif %}">/home</a>
          <a href="{{ '/about' | relative_url }}"
             class="nav-link{% if page.url == '/about' or page.url == '/about/' %} active{% endif %}">/about</a>
          <button
            id="theme-toggle"
            class="text-th-dim hover:text-th-accent transition-colors p-1"
            aria-label="Toggle dark/light theme"
            title="Toggle theme"
          >
            <svg class="w-3.5 h-3.5 hidden dark:block" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <svg class="w-3.5 h-3.5 block dark:hidden" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </nav>
      </header>

      <!-- ── Main ── -->
      <main class="flex-1 w-full">
        {{ content }}
      </main>

      <!-- ── Footer ── -->
      <footer class="mt-16 sm:mt-24 text-xs text-th-dim">
        <span class="text-th-accent">$</span>
        last build {{ site.time | date: "%Y-%m-%d" }}
      </footer>

    </div>

    <script src="{{ '/assets/js/galaxy.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/pixelate.js' | relative_url }}"></script>
    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        btn.addEventListener('click', function () {
          var isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
          window.dispatchEvent(new CustomEvent('themechange'));
        });
        window.matchMedia('(prefers-color-scheme: dark)')
          .addEventListener('change', function (e) {
            if (!localStorage.getItem('theme')) {
              document.documentElement.classList.toggle('dark', e.matches);
              window.dispatchEvent(new CustomEvent('themechange'));
            }
          });
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            document.documentElement.classList.add('transitions-ready');
          });
        });
      })();
    </script>
  </body>
</html>
