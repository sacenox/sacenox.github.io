---
layout: default
---

<!-- Post reads left-aligned, galaxy fills the right side on wide screens -->
<article class="max-w-3xl">

  <div class="text-sm text-th-dim mb-8">
    <a href="{{ '/' | relative_url }}" class="hover:text-th-accent transition-colors no-underline">
      <span class="text-th-accent">$</span> cd ..
    </a>
  </div>

  <header class="mb-10">
    <h1 class="text-xl sm:text-2xl lg:text-3xl font-semibold text-th-bold leading-tight">
      {{ page.title }}
    </h1>
    <time class="block mt-3 text-sm text-th-dim" datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%B %-d, %Y" }}
    </time>
  </header>

  <div class="content-well prose">
    {{ content }}
  </div>

</article>
