---
layout: default
---

<article>

  <div class="mb-8 font-sans text-base">
    <a href="{{ '/' | relative_url }}" class="text-[#888] hover:text-[#d4a76a] transition-colors no-underline">
      &larr; posts
    </a>
  </div>

  <header class="mb-10">
    <h1 class="text-3xl sm:text-4xl font-semibold text-[#f0f0f0] leading-tight tracking-tight">
      {{ page.title }}
    </h1>
    <time class="block mt-4 text-base font-sans text-[#888]" datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%B %-d, %Y" }}
    </time>
  </header>

  <div class="prose">
    {{ content }}
  </div>

</article>
